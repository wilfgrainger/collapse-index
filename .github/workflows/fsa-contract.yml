name: FSA Contract Discovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download official FSA contract files
        run: |
          mkdir -p fsa-contract
          curl --fail --location --retry 3 --max-time 120 \
            'https://fsaopendata.blob.core.windows.net/opendatacatalog/W1-11Trends_Allcountries_pub_postPubAmended_300426b.xlsx' \
            --output fsa-contract/combined.xlsx
          curl --fail --location --retry 3 --max-time 120 \
            'https://fsaopendata.blob.core.windows.net/opendatacatalog/2305388801FoodandYou2TrendsW1to11SPSSUserGuidev2.xlsx' \
            --output fsa-contract/user-guide.xlsx
          ls -lh fsa-contract
      - uses: actions/upload-artifact@v4
        with:
          name: fsa-contract
          path: fsa-contract
          retention-days: 1
