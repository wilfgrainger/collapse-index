name: Official Source Discovery

on:
  push:
    branches:
      - work/graphite-completion
    paths-ignore:
      - discovery/**
      - source-bundle/**
      - source-bundle.b64

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/graphite-completion
      - name: Install inspection libraries
        run: python -m pip install --quiet requests beautifulsoup4 openpyxl xlrd
      - name: Discover and inspect official resources
        run: |
          cat > /tmp/discover.py <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          import json, re, requests
          from bs4 import BeautifulSoup

          OUT = Path('discovery')
          RAW = OUT / 'raw'
          OUT.mkdir(exist_ok=True)
          RAW.mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent': 'UK-Stability-Monitor-source-validation/0.1 (+https://github.com/wilfgrainger/collapse-index)'})
          report = []

          pages = {
            'fsa_food': 'https://data.food.gov.uk/catalog/datasets/e8563667-8457-4662-9642-aeed6454113f',
            'nhs_rtt': 'https://www.england.nhs.uk/statistics/statistical-work-areas/rtt-waiting-times/rtt-data-2026-27/',
            'ons_housing': 'https://www.ons.gov.uk/peoplepopulationandcommunity/housing/datasets/privaterentalaffordabilityengland',
            'ons_trust': 'https://www.ons.gov.uk/peoplepopulationandcommunity/wellbeing/datasets/trustingovernmentuk',
            'ons_wellbeing': 'https://www.ons.gov.uk/peoplepopulationandcommunity/wellbeing/datasets/ukmeasuresofnationalwellbeing',
            'nrw_portal': 'https://api-portal.naturalresources.wales/',
          }
          direct = {
            'child_poverty': 'https://www.ons.gov.uk/explore-local-statistics/api/v1/data.csv?indicator=children-in-relative-poverty-after-housing&time=all',
            'ea_floods': 'https://environment.data.gov.uk/flood-monitoring/id/floods',
          }

          def safe_name(name, url, content_type=''):
            suffix = Path(urlparse(url).path).suffix
            if not suffix:
              if 'csv' in content_type: suffix = '.csv'
              elif 'json' in content_type: suffix = '.json'
              elif 'excel' in content_type or 'spreadsheet' in content_type: suffix = '.xlsx'
              else: suffix = '.bin'
            return RAW / f'{name}{suffix}'

          def get(url):
            r = session.get(url, timeout=45, allow_redirects=True)
            report.append(f'FETCH {url}\n  status={r.status_code} final={r.url} type={r.headers.get("content-type")} bytes={len(r.content)}')
            r.raise_for_status()
            return r

          selected = {}
          for name, url in direct.items():
            try:
              r = get(url)
              path = safe_name(name, r.url, r.headers.get('content-type',''))
              path.write_bytes(r.content)
              selected[name] = {'url': r.url, 'path': str(path), 'content_type': r.headers.get('content-type'), 'bytes': len(r.content)}
            except Exception as exc:
              report.append(f'ERROR {name}: {type(exc).__name__}: {exc}')

          for name, url in pages.items():
            try:
              r = get(url)
              html_path = RAW / f'{name}.html'
              html_path.write_bytes(r.content)
              soup = BeautifulSoup(r.text, 'html.parser')
              links = []
              for a in soup.find_all('a', href=True):
                text = ' '.join(a.get_text(' ', strip=True).split())
                href = urljoin(r.url, a['href'])
                links.append((text, href))
              report.append(f'LINKS {name}: {len(links)}')
              for text, href in links:
                key = f'{text} {href}'.lower()
                wanted = False
                if name == 'fsa_food' and ('abridged dataset' in key or key.endswith('.csv')): wanted = True
                if name == 'nhs_rtt' and ('overview timeseries' in key and ('may26' in key or 'may-26' in key)): wanted = True
                if name == 'ons_housing' and ('2024 edition' in key or key.endswith('.xlsx')): wanted = True
                if name == 'ons_trust' and ('2023 edition' in key or key.endswith('.xlsx')): wanted = True
                if name == 'ons_wellbeing' and ('june 2026' in key or key.endswith('.xlsx')): wanted = True
                if name == 'nrw_portal' and ('warning' in key or 'flood' in key): wanted = True
                if wanted:
                  report.append(f'  CANDIDATE text={text!r} href={href}')
              # Download the first narrowly matching file for stable inspection.
              priority = []
              for text, href in links:
                key = f'{text} {href}'.lower()
                if name == 'fsa_food' and 'abridged dataset' in key: priority.append((text, href))
                elif name == 'nhs_rtt' and 'overview timeseries' in key and 'may26' in key: priority.append((text, href))
                elif name == 'ons_housing' and href.lower().endswith(('.xlsx','.xls')): priority.append((text, href))
                elif name == 'ons_trust' and href.lower().endswith(('.xlsx','.xls')): priority.append((text, href))
                elif name == 'ons_wellbeing' and href.lower().endswith(('.xlsx','.xls')): priority.append((text, href))
              if priority:
                text, href = priority[0]
                rr = get(href)
                path = safe_name(name, rr.url, rr.headers.get('content-type',''))
                path.write_bytes(rr.content)
                selected[name] = {'url': rr.url, 'link_text': text, 'path': str(path), 'content_type': rr.headers.get('content-type'), 'bytes': len(rr.content)}
            except Exception as exc:
              report.append(f'ERROR {name}: {type(exc).__name__}: {exc}')

          (OUT / 'selected.json').write_text(json.dumps(selected, indent=2) + '\n')

          # Text previews and schema clues.
          for name, meta in selected.items():
            path = Path(meta['path'])
            preview = [f'## {name}', json.dumps(meta, indent=2)]
            try:
              if path.suffix.lower() in ('.csv', '.json', '.html', '.txt'):
                text = path.read_text(errors='replace')
                lines = text.splitlines()
                preview.append(f'lines={len(lines)}')
                preview.extend(lines[:30])
                for pattern in ('United Kingdom','food security','low food','incomplete','England','2024-25','2025'):
                  matches = [line for line in lines if pattern.lower() in line.lower()][:12]
                  if matches:
                    preview.append(f'-- matches: {pattern}')
                    preview.extend(matches)
              elif path.suffix.lower() in ('.xlsx', '.xls'):
                if path.suffix.lower() == '.xlsx':
                  import openpyxl
                  book = openpyxl.load_workbook(path, read_only=True, data_only=True)
                  preview.append('sheets=' + json.dumps(book.sheetnames))
                  for sheet in book.worksheets:
                    preview.append(f'-- sheet {sheet.title!r} rows={sheet.max_row} cols={sheet.max_column}')
                    for row in sheet.iter_rows(min_row=1, max_row=min(sheet.max_row, 25), values_only=True):
                      preview.append('\t'.join('' if value is None else str(value) for value in row[:20]))
                else:
                  import xlrd
                  book = xlrd.open_workbook(path)
                  preview.append('sheets=' + json.dumps(book.sheet_names()))
                  for sheet in book.sheets():
                    preview.append(f'-- sheet {sheet.name!r} rows={sheet.nrows} cols={sheet.ncols}')
                    for index in range(min(sheet.nrows, 25)):
                      preview.append('\t'.join(str(value) for value in sheet.row_values(index)[:20]))
            except Exception as exc:
              preview.append(f'INSPECTION ERROR {type(exc).__name__}: {exc}')
            (OUT / f'{name}.txt').write_text('\n'.join(preview) + '\n')

          (OUT / 'report.txt').write_text('\n'.join(report) + '\n')
          PY
          python /tmp/discover.py
      - name: Commit discovery evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discovery
          git diff --cached --quiet || git commit -m "chore: capture official source discovery [skip ci]"
          git push
