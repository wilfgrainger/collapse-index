name: ENPOP Contract Discovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download ENPOP payload
        run: |
          mkdir -p enpop-contract
          curl --fail --location --retry 3 --max-time 60 \
            'https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/timeseries/enpop/pop/data' \
            --output enpop-contract/enpop.json
          python - <<'PY'
          import json
          p=json.load(open('enpop-contract/enpop.json'))
          print(p['description'])
          print(p['years'][-3:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: enpop-contract
          path: enpop-contract
          retention-days: 1
