name: Source Bundle

on:
  push:
    branches:
      - work/graphite-completion
    paths-ignore:
      - source-bundle.b64

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/graphite-completion
      - name: Create source archive
        run: |
          tar --exclude=.git --exclude=.wrangler --exclude=source-bundle.b64 -czf /tmp/collapse-index-source.tar.gz .
          base64 -w 0 /tmp/collapse-index-source.tar.gz > source-bundle.b64
      - name: Commit temporary bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-bundle.b64
          git diff --cached --quiet || git commit -m "chore: materialise source bundle [skip ci]"
          git push
